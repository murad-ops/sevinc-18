<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevinc - 18 Yaşın Mübarək!</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Düşən Emojilər (Ürək və Partlama) */
        .emoji-drop {
            position: absolute;
            top: -20px;
            font-size: 24px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Başlanğıc Məktub (Zərf) */
        #envelope-container {
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #envelope-container:hover {
            transform: scale(1.05);
        }

        .envelope {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            width: 300px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5);
            border: 3px solid #fff;
        }

        .envelope p {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            line-height: 1.4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Məktub Açıldıqdan Sonrakı Məzmun */
        #content-container {
            display: none;
            z-index: 10;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 3px solid #ff4757;
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.4);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #ff4757;
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* Fırlanan Şəkillər */
        .cats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .cats-container img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff4757;
            animation: spinIn 1.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        @keyframes spinIn {
            0% { transform: rotate(0deg) scale(0); }
            80% { transform: rotate(360deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .audio-box {
            margin: 10px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #333;
        }

        audio {
            width: 220px;
            height: 35px;
        }
    </style>
</head>
<body onclick="startBackgroundMusic()">

    <!-- Əsas Musiqi (Sayta girən kimi və ya toxunanda avtomatik oynayır) -->
    <audio id="mainAudio" loop preload="auto">
        <source src="Music.mp3" type="audio/mpeg">
    </audio>

    <!-- Sürpriz Səs (Horn) -->
    <audio id="hornAudio" preload="auto">
        <source src="Horn.mp3" type="audio/mpeg">
    </audio>

    <!-- İlk Görünən Məktub -->
    <div id="envelope-container" onclick="openLetter(event)">
        <div class="envelope">
            <p>✉️ Qrupun sənə bir məktubu, hədiyyəsi var!<br><br>👉 Aç və başla! 🎁</p>
        </div>
    </div>

    <!-- Məktub Açıldıqdan Sonra Çıxan Hissə -->
    <div id="content-container">
        <h1>🎉 Sevinc, 18 yaşın mübarək! 🎂<br><span style="font-size: 18px; color: #eee;">Kawai Murad, çisli pampaları və Chikaawa ordusu səni təbrik edir! ❤️</span></h1>
        
        <div class="cats-container">
            <img src="kawai.jpg" alt="Kawai">
            <img src="Pampalari.jpg" alt="Çisli Pampaları">
            <img src="chikawaa.jpg" alt="Chikaawa Ordusu">
        </div>

        <div style="margin-top: 15px;">
            <div class="audio-box">
                <p style="margin: 0 0 5px 0; font-size: 12px; color: #aaa;">🎵 Əsas Musiqi</p>
                <button onclick="toggleMainMusic()" style="background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Dayandır / Başlat</button>
            </div>
            
            <div class="audio-box">
                <p style="margin: 0 0 5px 0; font-size: 12px; color: #aaa;">📢 Horn Səsi</p>
                <button onclick="playHorn()" style="background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Yenidən Çal 🎺</button>
            </div>
        </div>
    </div>

    <script>
        let musicStarted = false;

        // Sayta girib harasa toxunanda musiqini dərhal başlatmaq üçün
        function startBackgroundMusic() {
            if (!musicStarted) {
                var mainAudio = document.getElementById('mainAudio');
                mainAudio.play().then(() => {
                    musicStarted = true;
                }).catch(e => console.log("Musiqi icazəsi gözlənilir..."));
            }
        }

        // Məktuba basanda baş verənlər
        function openLetter(event) {
            event.stopPropagation(); // Əsas kliklə toqquşmasın

            // Əsas musiqini əminliklə başlat
            var mainAudio = document.getElementById('mainAudio');
            mainAudio.play();
            musicStarted = true;

            // Sürpriz Horn səsini 1 dəfə çal
            var hornAudio = document.getElementById('hornAudio');
            hornAudio.play().catch(e => console.log("Horn səs xətası: ", e));

            // Zərfi gizlət, əsas məzmunu göstər
            document.getElementById('envelope-container').style.display = 'none';
            document.getElementById('content-container').style.display = 'block';

            // Ürək və Partlama Emojiləri Yağmurunu Başlat
            setInterval(createEmojiDrop, 250);
        }

        // Emojilərin Yuxarıdan Düşməsi
        function createEmojiDrop() {
            const emojies = ['❤️', '🎉', '🥳', '🎂', '✨', '💖', '🎁'];
            const emojiEl = document.createElement('div');
            emojiEl.classList.add('emoji-drop');
            
            // Təsadüfi emoji seçimi
            emojiEl.innerHTML = emojies[Math.floor(Math.random() * emojies.length)];
            
            // Təsadüfi yerləşmə və sürət
            emojiEl.style.left = Math.random() * window.innerWidth + 'px';
            emojiEl.style.animationDuration = (Math.random() * 3 + 2) + 's';
            
            document.body.appendChild(emojiEl);

            // Ekrandan çıxanda silinsin
            setTimeout(() => {
                emojiEl.remove();
            }, 5000);
        }

        function toggleMainMusic() {
            var mainAudio = document.getElementById('mainAudio');
            if (mainAudio.paused) {
                mainAudio.play();
            } else {
                mainAudio.pause();
            }
        }

        function playHorn() {
            var hornAudio = document.getElementById('hornAudio');
            hornAudio.currentTime = 0;
            hornAudio.play();
        }
    </script>
</body>
</html>
